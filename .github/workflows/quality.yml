name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gml_shield_test
          POSTGRES_USER: gml_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gml_test -d gml_shield_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://gml_test:test-only-password@127.0.0.1:5432/gml_shield_test
      GML_TEST_DATABASE_URL: postgresql+asyncpg://gml_test:test-only-password@127.0.0.1:5432/gml_shield_test
      GML_JWT_SECRET: ci-only-jwt-secret-never-use-in-production
      GML_AES_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GML_ALLOWED_ORIGIN: https://testserver
      GML_COOKIE_SECURE: "true"
      GML_PRIVATE_UPLOADS: /tmp/gml-shield-test-uploads
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Compile Python
        run: python -m compileall app create_user.py migrations tests
      - name: Lint Python
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .
      - name: Test API and database behavior
        run: python -m pytest
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test safe DOM rendering
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build application container
        run: docker build -t gml-shield:ci .
