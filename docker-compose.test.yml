services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gml_shield_test
      POSTGRES_USER: gml_test
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gml_test -d gml_shield_test"]
      interval: 3s
      timeout: 3s
      retries: 20
